[package]
name        = "rclip-shell-link"
description = "Windows shell link (.lnk, MS-SHLLINK) reader and writer: no_std, allocation-free parsing"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[features]
default = []
## Enables `ShellLinkBuilder` — writing .lnk files — and the lossy string helpers.
alloc = ["rclip-core/alloc", "rclip-idlist/alloc"]
std = ["alloc", "rclip-core/std", "rclip-idlist/std"]
## Decoding ANSI `StringData` through a named legacy code page. Off by default:
## every link written this century sets `IsUnicode`, so most callers never need
## the tables. Forwards to `rclip-idlist`, which owns `ShellStr`.
codepage = ["rclip-idlist/codepage"]

[dependencies]
rclip-core   = { workspace = true }
# The LinkTargetIDList and the VistaAndAboveIDListDataBlock are both plain
# ITEMIDLISTs, and `CFSTR_SHELLIDLIST` needs the same parser. One crate, two
# consumers -- see plan/PLAN.md 4.7.
rclip-idlist = { version = "0.1.0", path = "../rclip-idlist" }

# See the note in rclip-idlist/Cargo.toml: this makes `cargo test -p
# rclip-shell-link` build the tests with `std` rather than skipping the ones
# that need the builder.
[dev-dependencies]
rclip-shell-link = { path = ".", features = ["std"] }
