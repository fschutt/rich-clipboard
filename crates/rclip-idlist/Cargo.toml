[package]
name        = "rclip-idlist"
description = "Windows shell ITEMIDLIST / PIDL / CIDA parser: defensive, no_std, allocation-free"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[features]
default = []
## Enables the `ItemIdListBuilder` and the lossy string/path helpers.
## `rclip-codepage?/alloc` is the weak-dependency form: it turns on that
## crate's owning helpers only when the `codepage` feature actually pulled it
## in, so `alloc` alone still links no tables.
alloc = ["rclip-core/alloc", "rclip-codepage?/alloc"]
std = ["alloc", "rclip-core/std", "rclip-codepage?/std"]
## Decoding `ShellStr::Ansi` through a named legacy code page. Off by default:
## a caller that only ever sees Unicode shell items should not link the tables.
codepage = ["dep:rclip-codepage"]

[dependencies]
rclip-core = { workspace = true }
rclip-codepage = { workspace = true, optional = true }

# A dev-dependency on this crate itself, so that `cargo test -p rclip-idlist`
# builds the integration tests with `std` on. The tests exercise the `alloc`
# API, and the alternative -- `required-features` on the test target -- makes a
# plain `cargo test` skip them silently, which is worse than not having them.
[dev-dependencies]
rclip-idlist = { path = ".", features = ["std"] }
