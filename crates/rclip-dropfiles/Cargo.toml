[package]
name        = "rclip-dropfiles"
description = "CF_HDROP / DROPFILES parser and serializer: the Win32 clipboard file list"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[features]
default = []
## Enables the serializer, which must own its output.
## `rclip-codepage?/alloc` is the weak-dependency form: it turns on that
## crate's owning helpers only when the `codepage` feature actually pulled it
## in, so `alloc` alone still links no tables.
alloc = ["rclip-core/alloc", "rclip-codepage?/alloc"]
std = ["alloc", "rclip-core/std", "rclip-codepage?/std"]
## Decoding and encoding the `fWide == 0` path array through a named legacy
## code page. Off by default: every modern producer sets `fWide`, so most
## callers never need the tables.
codepage = ["dep:rclip-codepage"]

[dependencies]
rclip-core = { workspace = true }
rclip-codepage = { workspace = true, optional = true }

[dev-dependencies]
rclip-dropfiles = { path = ".", features = ["std"] }
