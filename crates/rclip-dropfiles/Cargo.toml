[package]
name        = "rclip-dropfiles"
description = "CF_HDROP / DROPFILES parser and serializer: the Win32 clipboard file list"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[features]
default = []
## Enables the serializer, which must own its output.
alloc = ["rclip-core/alloc"]
std = ["alloc", "rclip-core/std"]

[dependencies]
rclip-core = { workspace = true }

[dev-dependencies]
rclip-dropfiles = { path = ".", features = ["std"] }
