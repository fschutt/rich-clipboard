[package]
name        = "rclip-rtf"
description = "RTF 1.9.1 tokenizer and clipboard-grade styled-text reader"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[features]
default = []
## Enables `Document` — the owned, merged-run representation. Parsing itself
## never needs it; only text that `\uN` / `\'hh` escapes made non-contiguous does.
alloc = ["rclip-core/alloc"]
std = ["alloc", "rclip-core/std"]
## Decoding `\'hh` bytes under a code page other than Windows-1252 or Latin-1:
## `\ansicpgN` for any N `rclip-codepage` implements, plus `\mac` (10000),
## `\pc` (437) and `\pca` (850). Off by default: clipboard RTF is almost always
## `\ansicpg1252`, which needs no tables.
codepage = ["dep:rclip-codepage"]

[dependencies]
rclip-core = { workspace = true }
rclip-codepage = { workspace = true, optional = true }

## Self dev-dependency so `cargo test -p rclip-rtf` exercises the `alloc` half
## of the crate too, without making `alloc` a default feature. Cargo permits
## dev-dependency cycles; `cargo build --no-default-features` is unaffected.
[dev-dependencies]
rclip-rtf = { path = ".", features = ["std"] }
