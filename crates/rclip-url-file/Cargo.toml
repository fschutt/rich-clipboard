[package]
name        = "rclip-url-file"
description = "Parser for Windows `.url` InternetShortcut files"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[features]
default = []
## Enables owning APIs: unquoting into a `String`, `ShortcutTarget` conversions
## that must copy.
alloc = ["rclip-core/alloc"]
std = ["alloc", "rclip-core/std"]
## Decoding the `IDList=` key into shell items. Implies `alloc`: the value is
## `WritePrivateProfileStruct` hex, so the decoded PIDL is not a slice of the
## file and cannot be borrowed from it. Off by default -- a `.url` on disk
## almost always carries an empty `IDList=`, and a crate that only wants `URL=`
## should not link a PIDL parser.
idlist = ["alloc", "dep:rclip-idlist", "rclip-idlist/alloc"]
## Transcoding a legacy `.url` out of a Windows code page, for the
## `[InternetShortcut.A]` section. Implies `alloc`: transcoding cannot borrow,
## the decoded text is not a contiguous slice of the input anywhere.
codepage = ["alloc", "dep:rclip-codepage", "rclip-codepage/alloc"]

[dependencies]
rclip-core = { workspace = true }
rclip-codepage = { workspace = true, optional = true }
rclip-idlist = { workspace = true, optional = true }
