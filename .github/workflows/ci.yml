name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  no_std:
    name: no_std holds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # A target with no std at all: if anything in a codec crate reaches
          # for std, this is where it fails. Building without default features
          # on a hosted target would not catch it, because std is still there.
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: build every codec crate for a bare-metal target
        run: |
          set -euo pipefail
          for manifest in crates/*/Cargo.toml; do
            name=$(basename "$(dirname "$manifest")")
            # Two crates are deliberately not codecs and are allowed std:
            # the consumer-facing facade, and the corpus test harness, which
            # walks the filesystem for a living. Everything else must hold
            # no_std, and the check below makes a codec silently dropping the
            # attribute a failure rather than an exemption.
            case "$name" in
              rich-clipboard|rclip-corpus-tests) continue ;;
            esac
            if ! grep -q '#!\[no_std\]' "crates/$name/src/lib.rs"; then
              echo "::error file=crates/$name/src/lib.rs::$name is not exempt but does not declare no_std"
              exit 1
            fi
            echo "::group::$name"
            cargo build -p "$name" --no-default-features --target thumbv7em-none-eabi
            # Also with alloc: thumbv7em is 32-bit, and code behind the alloc
            # feature is otherwise never built for a 32-bit target at all. That
            # gap hid a ten-digit usize literal in rclip-cf-html that simply
            # does not compile where usize is 32 bits.
            if cargo metadata --no-deps --format-version 1 \
                 | grep -q "\"$name\".*\"alloc\""; then
              cargo build -p "$name" --no-default-features --features alloc \
                --target thumbv7em-none-eabi
            fi
            echo "::endgroup::"
          done

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features

  unsafe:
    name: no unsafe code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every codec crate must forbid unsafe
        run: |
          set -euo pipefail
          fail=0
          for lib in crates/*/src/lib.rs; do
            name=$(basename "$(dirname "$(dirname "$lib")")")
            if ! grep -q '#!\[forbid(unsafe_code)\]' "$lib"; then
              echo "::error file=$lib::$name does not forbid unsafe_code"
              fail=1
            fi
          done
          exit $fail
