# cargo-fuzz keeps its own nightly-only workspace: `-Z sanitizer` and the
# `#[no_main]` targets below do not build on stable, and a nightly-only member
# would poison `cargo build` for the whole repo. The root `Cargo.toml` therefore
# lists this directory under `[workspace.exclude]`, and this empty `[workspace]`
# table makes it a workspace root of its own.
[workspace]

[package]
name    = "rclip-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# Structure-aware input for the three targets whose entry point does not take
# bytes. `rich_clipboard::decode_payload` takes a `Platform` plus a list of
# `(native identifier, bytes, item index)`, and `rclip_rtf::Writer` takes
# styled runs; a `&[u8]` target would have to invent that structure, and every
# obvious invention narrows what the mutator can reach. Hand-written `Arbitrary`
# impls rather than the derive, because the interesting part is the *weighting*
# -- mostly real clipboard identifiers, some arbitrary strings -- which a derive
# cannot express and which is what gets the real decoders reached at all.
arbitrary = "1"

# Every codec is pulled in with `std`, which transitively turns on `alloc`.
# The point of a fuzz target is to reach as much code as possible, and the
# owning halves of these crates -- the serializers, the lossy decoders -- are
# exactly the parts that allocate from attacker-controlled lengths.
rclip-bookmark      = { path = "../crates/rclip-bookmark",      features = ["std"] }
rclip-cf-html       = { path = "../crates/rclip-cf-html",       features = ["std"] }
rclip-codepage      = { path = "../crates/rclip-codepage",      features = ["std"] }
rclip-core          = { path = "../crates/rclip-core",          features = ["std"] }
rclip-desktop-entry = { path = "../crates/rclip-desktop-entry", features = ["std"] }
rclip-dib           = { path = "../crates/rclip-dib",           features = ["std"] }
rclip-dropfiles     = { path = "../crates/rclip-dropfiles",     features = ["std"] }
rclip-file-desc     = { path = "../crates/rclip-file-desc",     features = ["std"] }
rclip-idlist        = { path = "../crates/rclip-idlist",        features = ["std"] }
rclip-rtf           = { path = "../crates/rclip-rtf",           features = ["std"] }
rclip-shell-link    = { path = "../crates/rclip-shell-link",    features = ["std"] }
rclip-html          = { path = "../crates/rclip-html",          features = ["std"] }
rclip-uri-list      = { path = "../crates/rclip-uri-list",      features = ["std"] }
rclip-url-file      = { path = "../crates/rclip-url-file",      features = ["std"] }
rclip-webloc        = { path = "../crates/rclip-webloc",        features = ["std"] }

# The facade, with every codec compiled in. `full` is the crate's own name for
# "every format", and with `std` on top it is what `--all-features` resolves to.
# A build with formats missing would send `decode` down the `FeatureDisabled`
# arm instead of into the codec, which is the opposite of what a fuzz target
# wants.
rich-clipboard = { path = "../crates/rich-clipboard", features = ["std", "full"] }

[profile.release]
debug = 1

# ---------------------------------------------------------------------------
# One target per parser entry point. Several crates have more than one: they
# are separate formats that happen to share a crate, and merging them into one
# target would let libFuzzer spend its whole budget on whichever has the
# shallower magic check.
# ---------------------------------------------------------------------------

[[bin]]
name = "codepage_decode"
path = "fuzz_targets/codepage_decode.rs"
test = false
doc = false
bench = false

